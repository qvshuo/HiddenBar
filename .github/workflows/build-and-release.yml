name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read project version
        id: version
        run: |
          BUILD_SETTINGS=$(xcodebuild \
            -project "Hidden Bar.xcodeproj" \
            -scheme "Hidden Bar" \
            -configuration Release \
            -showBuildSettings)
          MARKETING_VERSION=$(awk -F= '/MARKETING_VERSION/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' <<< "$BUILD_SETTINGS")
          CURRENT_PROJECT_VERSION=$(awk -F= '/CURRENT_PROJECT_VERSION/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit }' <<< "$BUILD_SETTINGS")
          if [[ -z "$MARKETING_VERSION" || -z "$CURRENT_PROJECT_VERSION" ]]; then
            echo "Missing MARKETING_VERSION or CURRENT_PROJECT_VERSION" >&2
            exit 1
          fi
          echo "version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$CURRENT_PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $MARKETING_VERSION ($CURRENT_PROJECT_VERSION)"

      - name: Build
        run: |
          xcodebuild \
            -project "Hidden Bar.xcodeproj" \
            -scheme "Hidden Bar" \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package
        run: |
          APP_PATH="DerivedData/Build/Products/Release/Hidden Bar.app"
          ZIP_NAME="HiddenBar-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent "${APP_PATH}" "${ZIP_NAME}"
          echo "asset_path=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
